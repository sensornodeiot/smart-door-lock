; Smart Door Lock (ZKTeco / ESP32) — component bring-up project
;
; Board: SSN32 (ESP32-WROOM-32E)  ->  board = esp32dev
; One environment per component so each new part is tested in isolation before
; combining. Per-test code lives in test/<name>/main.cpp and is pulled into the
; build via build_src_filter, mirroring the ClaudeUsageDisplay project pattern.
;
;   pio run -e wiegand-test -t upload -t monitor   ; card reader (D0/D1)
;   pio run -e lock-test    -t upload -t monitor   ; drop-bolt unlock trigger
;   pio run -e pulse-test   -t upload -t monitor   ; exit-button / PUSH sense
;   pio run -e led-test     -t upload -t monitor   ; reader LED optocoupler
;   pio run -e beeper-test  -t upload -t monitor   ; beeper optocoupler
;   pio run -e esp32dev     -t upload -t monitor   ; main app (stub for now)

[env]
platform = espressif32 @ 6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I include

; --- Main application (src/main.cpp) — stub until components are proven ---
[env:esp32dev]

; --- Stage 2: card reader. Wiegand D0=GPIO4 (green), D1=GPIO16 (white) ---
[env:wiegand-test]
build_src_filter = -<*> +<../test/wiegand_test/>

; --- Stage 4: lock trigger. Pulse GPIO12 -> transistor -> AP108 PUSH (fail-safe) ---
[env:lock-test]
build_src_filter = -<*> +<../test/lock_test/>

; --- Stage 5: exit-button / PUSH pulse sense on GPIO21 ---
[env:pulse-test]
build_src_filter = -<*> +<../test/pulse_read_test/>

; --- Reader LED optocoupler control on GPIO14 ---
[env:led-test]
build_src_filter = -<*> +<../test/led_test/>

; --- Beeper optocoupler control on GPIO27 ---
[env:beeper-test]
build_src_filter = -<*> +<../test/beeper_test/>
